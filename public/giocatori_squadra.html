<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giocatori per squadra</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="navbar-slot"></div>

  <main class="shell">
    <section class="hero">
      <div class="hero-inner">
        <h1>Giocatori di una squadra</h1>
      </div>
    </section>

    <section class="card pad">
      <div class="controls">
        <label for="squadra">Seleziona squadra</label>
        <select id="squadra"></select>
        <button id="show" class="btn btn-main">Mostra</button>
      </div>
      <p id="team-name" class="status"></p>
    </section>

    <section class="card">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Cognome</th>
            <th>Ruolo</th>
            <th>Nazionalita</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="app.js"></script>
  <script src="giocatori_squadra.js"></script>
</body>
</html>
