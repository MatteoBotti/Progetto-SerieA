<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Import Stadi</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="navbar-slot"></div>
  <main class="shell">
    <section class="hero">
      <div class="hero-inner">
        <h1>Import stadi</h1>
      </div>
    </section>
    <section class="card pad">
      <div class="controls">
        <label for="seasonApi">Season API</label>
        <input id="seasonApi" type="number" min="2000" max="2100" value="2024" />
        <button id="run" class="btn btn-main">Avvia import</button>
      </div>
      <p id="status" class="status"></p>
      <pre id="output" class="card pad" style="overflow:auto"></pre>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="app.js"></script>
  <script src="api_stadio.js"></script>
</body>
</html>
